name: build-sm89

# Builds llama.cpp server-cuda Docker image targeting sm_89 (Ada Lovelace,
# RTX 40-series) and pushes to ghcr.io/Chyrain/llama-cpp-sm89-docker.
#
# The official ghcr.io/ggml-org/llama.cpp:server-cuda image dropped sm_89
# support around mid-2026 — see https://github.com/ggml-org/llama.cpp —
# so this workflow recompiles from master with CMAKE_CUDA_ARCHITECTURES=89.
#
# Triggers:
#   - workflow_dispatch (manual): set "tag" input to override image tag
#   - schedule (weekly): keeps the image current with upstream master
#   - push to main: rebuild on workflow file change
#
# Pushed tags:
#   - sm89-latest   (always, latest master build)
#   - sm89-<run#>-<short-sha>  (every run, immutable audit trail)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (default: latest)"
        required: false
        default: "latest"
      llama_ref:
        description: "llama.cpp git ref to build (branch/tag/commit)"
        required: false
        default: "master"
  schedule:
    - cron: "17 6 * * 1"  # 06:17 UTC every Monday
  push:
    branches: [main]
    paths: [.github/workflows/build-sm89.yml, Dockerfile]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk (GH runners have ~30G free)
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN=${{ github.run_number }}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USER_TAG="${{ inputs.tag }}"
          else
            USER_TAG="latest"
          fi
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sm89-${USER_TAG}"
          if [ "$USER_TAG" = "latest" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sm89-${RUN}-${SHA}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=12.8.1
            UBUNTU_VERSION=24.04
            CUDA_DOCKER_ARCH=89
            LLAMA_REF=${{ inputs.llama_ref || 'master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Built image" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: \`${{ steps.tags.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ggml-org/llama.cpp@${{ inputs.llama_ref || 'master' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "CUDA arch: sm_89 (Ada Lovelace)" >> "$GITHUB_STEP_SUMMARY"
