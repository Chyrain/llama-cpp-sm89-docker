name: build-sm89

# Builds llama.cpp server-cuda Docker image targeting sm_89 (Ada Lovelace,
# RTX 40-series) and pushes to ghcr.io/<owner>/llama-cpp-sm89-docker.
#
# The official ghcr.io/ggml-org/llama.cpp:server-cuda image dropped sm_89
# support around mid-2026 — see https://github.com/ggml-org/llama.cpp —
# so this workflow recompiles from master with CMAKE_CUDA_ARCHITECTURES=89.
#
# Triggers:
#   - workflow_dispatch (manual): set "tag" input to override image tag
#   - schedule (weekly): keeps the image current with upstream master
#   - push to main: rebuild on workflow/Dockerfile change
#
# Pushed tags:
#   - sm89-latest   (always, latest master build)
#   - sm89-<run#>-<short-sha>  (every run, immutable audit trail)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (default: latest)"
        required: false
        default: "latest"
      llama_ref:
        description: "llama.cpp git ref to build (branch/tag/commit)"
        required: false
        default: "master"
  schedule:
    - cron: "17 6 * * 1"  # 06:17 UTC every Monday
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sm89.yml"
      - "Dockerfile"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      # ghcr.io requires lowercase paths; github.repository preserves case.
      - name: Normalize image name (lowercase)
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Free up disk (GH runners have ~30G free)
        run: |
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN=${{ github.run_number }}
          IMG="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          # lowercase the user-supplied tag too
          USER_TAG=$(echo "${{ inputs.tag || 'latest' }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMG}:sm89-${USER_TAG}"
          if [ "${USER_TAG}" = "latest" ]; then
            TAGS="${TAGS},${IMG}:sm89-${RUN}-${SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=12.8.1
            UBUNTU_VERSION=24.04
            CUDA_DOCKER_ARCH=89
            LLAMA_REF=${{ inputs.llama_ref || 'master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "### Built image"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo ""
            echo "- Source: \`ggml-org/llama.cpp@${{ inputs.llama_ref || 'master' }}\`"
            echo "- CUDA arch: \`sm_89\` (Ada Lovelace)"
          } >> "$GITHUB_STEP_SUMMARY"
